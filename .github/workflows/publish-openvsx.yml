name: Publish to Open VSX

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to download VSIX from (optional, e.g. v0.9.5)'
        required: false
        default: 'v0.9.5'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish VSIX to Open VSX
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download VSIX from Release asset
        id: check-asset
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          mkdir -p ./release-assets
          if [ -n "$TAG_NAME" ]; then
            echo "Attempting to download release asset for tag $TAG_NAME..."
            gh release download "$TAG_NAME" --pattern "*.vsix" --dir ./release-assets || true
          fi
          if ls ./release-assets/*.vsix 1> /dev/null 2>&1; then
            echo "asset_found=true" >> "$GITHUB_OUTPUT"
            echo "Found release VSIX asset:"
            ls -la ./release-assets/*.vsix
          else
            echo "asset_found=false" >> "$GITHUB_OUTPUT"
            echo "No existing release asset found. Will build from source."
          fi

      - name: Setup pnpm (fallback build)
        if: steps.check-asset.outputs.asset_found != 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: ${{ steps.check-asset.outputs.asset_found != 'true' && 'pnpm' || '' }}
          cache-dependency-path: vscode-extension/pnpm-lock.yaml

      - name: Build and Package VSIX from source
        if: steps.check-asset.outputs.asset_found != 'true'
        working-directory: vscode-extension
        run: |
          pnpm install --frozen-lockfile
          node ./scripts/build-extension.js
          pnpm run compile
          npx @vscode/vsce package --no-dependencies
          mkdir -p ../release-assets
          cp ./*.vsix ../release-assets/

      - name: Publish to Open VSX Registry
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          VSIX_FILE=$(ls ./release-assets/*.vsix | head -n 1)
          if [ -z "$VSIX_FILE" ]; then
            echo "Error: No VSIX file found to publish."
            exit 1
          fi
          echo "Publishing $VSIX_FILE to Open VSX Registry (EggR0.integrated-power)..."
          # Attempt Trusted Publishing (OIDC) first
          if npx ovsx publish "$VSIX_FILE" --trusted-publishing --skip-duplicate; then
            echo "Successfully published to Open VSX via Trusted Publishing!"
          elif [ -n "$OVSX_PAT" ]; then
            echo "Trusted Publishing not configured or pending; falling back to PAT..."
            npx ovsx publish "$VSIX_FILE" -p "$OVSX_PAT" --skip-duplicate
            echo "Successfully published to Open VSX via PAT!"
          else
            echo "Failed to publish."
            exit 1
          fi
